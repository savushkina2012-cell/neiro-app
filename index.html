:root{
  --bg:#0A0A0A; --card:#151515; --card2:#1C1C1C; --line:#262626;
  --text:#F2F2F2; --muted:#9A9A9A; --accent:#CCFF00; --accent-ink:#0A0A0A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Golos Text",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 40px}
h1,h2,h3,.num,.price{font-family:"Unbounded","Golos Text",system-ui,sans-serif}
a{color:inherit;text-decoration:none}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.hero h1{font-size:34px;line-height:1.08;font-weight:700;margin:14px 0 14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:16px;max-width:440px}

.cta{margin:28px 0 8px;padding:24px 22px;border-radius:24px;background:var(--accent);color:var(--accent-ink)}
.cta h2{font-size:22px;line-height:1.15;font-weight:700;margin-bottom:10px}
.cta p{font-size:15px;opacity:.82;margin-bottom:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 18px;border-radius:16px;background:var(--accent-ink);color:var(--accent);font-weight:600;font-size:16px}
.btn:active{transform:scale(.98)}

.section{margin-top:34px}
.section h3{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 4px 12px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:background .15s,border-color .15s}
.item:active{background:var(--card2);border-color:var(--accent)}
.num{flex:0 0 auto;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--accent);font-size:13px;font-weight:700}
.body{flex:1 1 auto;min-width:0}
.title{font-weight:600;font-size:16px;line-height:1.3}
.sub{color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px}
.price{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;background:rgba(204,255,0,.12);color:var(--accent);font-size:12px;font-weight:700}
.arrow{flex:0 0 auto;color:var(--accent);font-size:20px;line-height:1}

.footer{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
.footer b{display:block;color:var(--text);font-weight:600;font-size:15px;margin-bottom:2px}
.footer a{color:var(--accent)}
</style>

  }

  var html = "";
  html += '<header class="hero"><div class="eyebrow">' + esc(D.hero.eyebrow) + "</div>" +
    "<h1>" + esc(D.hero.titleLine1) + "<br><span>" + esc(D.hero.titleLine2) + "</span></h1>" +
    "<p>" + esc(D.hero.text) + "</p></header>";

  html += '<section class="cta"><h2>' + esc(D.cta.title) + "</h2><p>" + esc(D.cta.text) + "</p>" +
    link(D.cta.url, "btn", esc(D.cta.button) + " →") + "</section>";

  var n = 0;
  D.sections.forEach(function (sec) {
    html += '<section class="section"><h3>' + esc(sec.title) + '</h3><div class="list">';
    sec.items.forEach(function (it) {
      n++;
      var num = n < 10 ? "0" + n : String(n);
      var inner = '<span class="num">' + num + "</span>" +
        '<span class="body"><span class="title">' + esc(it.title) + "</span>" +
        (it.sub ? '<span class="sub" style="display:block">' + esc(it.sub) + "</span>" : "") +
        (it.price ? '<span class="price">' + esc(it.price) + "</span>" : "") +
        '</span><span class="arrow">→</span>';
      html += link(it.url, "item", inner);
    });
    html += "</div></section>";
  });

  html += '<footer class="footer"><b>' + esc(D.footer.name) + "</b>" + esc(D.footer.brand) +
    (D.footer.contactUrl ? " · " + link(D.footer.contactUrl, "", esc(D.footer.contactText)) : "") +
    "</footer>";

  document.getElementById("app").innerHTML = html;

  /* 4. Запуск внутри Телеграма */
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor(D.colors.bg); } catch (e) {}
    try { tg.setBackgroundColor(D.colors.bg); } catch (e) {}
  } else if (inTelegram) {
    postEvent("web_app_ready");
    postEvent("web_app_expand");
    postEvent("web_app_set_header_color", { color: D.colors.bg });
    postEvent("web_app_set_background_color", { color: D.colors.bg });
  }

  /* Прямая отправка событий, если Telegram.WebApp не загрузился */
  function postEvent(type, data) {
    var payload = data ? JSON.stringify(data) : "";
    try {
      if (window.TelegramWebviewProxy) {
        window.TelegramWebviewProxy.postEvent(type, payload);
      } else if (window.external && "notify" in window.external) {
        window.external.notify(JSON.stringify({ eventType: type, eventData: data || "" }));
      } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) {
        window.webkit.messageHandlers.performAction.postMessage(JSON.stringify({ eventType: type, eventData: data || "" }));
      } else if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || "" }), "*");
      }
    } catch (e) {}
  }

  /* 5–6. Обработчик кликов по ссылкам */
  function open(url) {
    var isTg = url.indexOf("https://t.me/") === 0;
    if (tg) {
      if (isTg) {
        try { tg.close(); } catch (e) {}
        tg.openTelegramLink(url);
      } else {
        tg.openLink(url);
      }
    } else {
      if (isTg) {
        postEvent("web_app_close");
        postEvent("web_app_open_tg_link", { path_full: url.replace("https://t.me", "") });
      } else {
        postEvent("web_app_open_link", { url: url });
      }
    }
  }

  var links = document.querySelectorAll("a[data-url]");
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener("click", function (ev) {
      /* 8. В обычном браузере ссылки просто открываются */
      if (!inTelegram) return;
      ev.preventDefault();
      open(this.getAttribute("data-url"));
    });
  }
})();
</script>
</body>
</html>
